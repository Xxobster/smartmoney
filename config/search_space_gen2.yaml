# GENERATION 2 — preregistered BEFORE any Gen2 outer OOS is viewed.
# Frozen: 2026-07-27. Do not relax gates after viewing OOS.
# Reason for redesign (from Gen1 sitrep): Gen1 was too sparse (14 OOS trades).
# Changes are methodological (fold length + execution TF + confluence floor),
# not post-hoc gate relaxation.

generation_id: gen2_sparse_redesign_20260727
parent_generation: gen1_smc_confluence_retrace
hypothesis_family: smc_confluence_retrace_freq
economic_rationale: >
  Same SMC economic story as Gen1 (HTF order flow + liquidity event + structure
  shift + zone retrace), but redesigned for sample sufficiency: 5m execution,
  lower min confluence, optional FVG, longer outer test windows, and folds
  anchored from the end of the research calendar so evidence uses recent regimes.
  Engine of record: botsgeneral tradesim (Bybit taker 0.055%, RESEARCH_PROXY Binance OHLCV).

root_random_seed: 20260727
trial_budget_total: 120
llm_proposal_budget: 8
optuna_trials_per_proposal: 6
engine: tradesim
evidence_class_market: RESEARCH_PROXY_binance_ohlcv_bybit_cost_model

# Longer folds for sparse/medium-frequency strategies (preregistered)
outer_folds:
  count: 5
  scheme: expanding_from_end
  min_train_days: 540
  test_days: 180
  purge_bars_execution_tf: 96
  embargo_bars_execution_tf: 48

inner_folds:
  count: 3
  scheme: expanding
  purge_bars_execution_tf: 48
  embargo_bars_execution_tf: 24

selection_objective: inner_mean_expectancy_after_costs
tie_breaker: more_trades_then_lower_mdd

# Preregistered hypothesis families (bounded — do not add after OOS)
