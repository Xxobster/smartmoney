# GENERATION 3 — preregistered BEFORE Gen3 OOS is viewed.
# Frozen: 2026-07-27.
# Economic reason (NOT from ranking OOS winners): Gen2 produced ample trades but
# fees/slip (~$250 BTC alone) crushed PF below 1.20. Hypothesis: raise entry
# quality (require liquidity sweep + volume confirm + HTF/PD) and lengthen
# targets so expectancy covers Bybit taker costs. Do not cherry-pick symbols
# from Gen2 OOS.

